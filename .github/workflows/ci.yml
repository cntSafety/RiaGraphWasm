name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      package_version:
        description: "@riagraph/wasm-core version to test"
        required: true
        default: "0.16.0"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - os: macos-latest
            platform: darwin
            arch: arm64
          - os: windows-latest
            platform: win32
            arch: x64
    env:
      RIAG_WASM_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.package_version || '0.16.0' }}
    steps:
      - name: Checkout wasm package tests
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: tools/wasm

      - name: Fetch RiaGraph source archive
        shell: bash
        env:
          RIAGRAPH_TOKEN: ${{ secrets.TOKEN_GH_RIAGRAPH_PUBLISH }}
        run: |
          curl -fsSL -H "Authorization: Bearer $RIAGRAPH_TOKEN" \
            https://api.github.com/repos/cntSafety/RiaGraph/tarball/main \
            | tar -xz --strip-components=1 --exclude='*/tools/wasm'

      - name: Checkout test dataset
        uses: actions/checkout@v4
        with:
          repository: cntSafety/RiaGraphDataset
          token: ${{ secrets.TOKEN_GH_RIAGRAPH_PUBLISH }}
          fetch-depth: 1
          path: dataset

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/wasm/package-lock.json

      - name: Enable long paths (Windows)
        if: ${{ matrix.platform == 'win32' }}
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          git config --system core.longpaths true

      - name: Install test dependencies
        working-directory: tools/wasm
        run: npm ci

      - name: Install wasm package
        working-directory: tools/wasm
        shell: bash
        run: |
          rm -rf package
          package_tgz="$(npm pack "@riagraph/wasm-core@${RIAG_WASM_VERSION}" --silent)"
          mkdir package
          tar -xzf "${package_tgz}" -C package --strip-components=1
          node -e "const pkg = require('./package/package.json'); console.log(pkg.name + '@' + pkg.version)"
          node -e "const fs = require('fs'); const pkg = require('./package.json'); pkg.version = process.env.RIAG_WASM_VERSION; fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');"

      - name: Run API tests
        working-directory: tools/wasm
        run: npm test
